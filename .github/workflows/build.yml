name: Build DAVIER NC PLASMA V3.3 EXE with ICON
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyserial pyinstaller pillow
      
      - name: Build EXE with Icon
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "DAVIER_NC_PLASMA_V3.3" --icon "davier_icon.ico" --add-data "davier_icon.ico;." --add-data "davier_logo_full_transparent.png;." --add-data "davier_logo_transparent.png;." main.py
      
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DAVIER_NC_PLASMA_V3.3-Windows-ICON
          path: dist/DAVIER_NC_PLASMA_V3.3.exe
